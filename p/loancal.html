<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-cyan-600/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-calculator"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">EMI Calculator</h1>
                <p class="text-xs text-slate-400">Calculate Monthly Loan Repayments</p>
            </div>
        </div>

        <div class="space-y-3">
            <div>
                <label class="text-xs font-semibold text-slate-300 block mb-1">Loan Amount (LKR)</label>
                <input type="number" id="amount" placeholder="100000" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-cyan-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Interest Rate (%)</label>
                    <input type="number" id="rate" placeholder="12" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Months</label>
                    <input type="number" id="months" placeholder="12" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <button onclick="calculateEMI()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-cyan-600/20">Calculate Monthly EMI</button>

            <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl text-center">
                <span class="text-xs text-slate-400 block mb-1">Monthly Payment</span>
                <span id="emiResult" class="text-2xl font-bold text-cyan-400">LKR 0.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculateEMI() {
            const p = parseFloat(document.getElementById('amount').value);
            const r = parseFloat(document.getElementById('rate').value) / 12 / 100;
            const n = parseFloat(document.getElementById('months').value);

            if(isNaN(p) || isNaN(r) || isNaN(n)) return alert('Please enter valid details');

            const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            document.getElementById('emiResult').innerText = `LKR ${emi.toFixed(2)}`;
        }
    </script>
</body>
</html>
