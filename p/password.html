<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyVault Passgen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">Password Studio</h1>
                <p class="text-xs text-slate-400">Generate secure & custom passwords</p>
            </div>
        </div>

        <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-between">
            <span id="passDisplay" class="text-base font-mono text-emerald-400 font-bold truncate pr-2">Click Generate</span>
            <button onclick="copyPassword()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 shrink-0"><i class="fa-regular fa-copy"></i> Copy</button>
        </div>

        <div class="space-y-4">
            <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                    <span>Length</span>
                    <span id="lenVal" class="text-emerald-400">16</span>
                </div>
                <input type="range" id="passLen" min="8" max="32" value="16" oninput="document.getElementById('lenVal').innerText=this.value" class="w-full accent-emerald-500">
            </div>

            <div class="space-y-2 text-xs">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="incNumbers" checked class="rounded bg-slate-950 border-slate-800 accent-emerald-500">
                    Include Numbers (0-9)
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="incSymbols" checked class="rounded bg-slate-950 border-slate-800 accent-emerald-500">
                    Include Symbols (!@#$)
                </label>
            </div>

            <button onclick="generatePass()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-emerald-600/20">Generate Password</button>
        </div>
    </div>

    <script>
        function generatePass() {
            const len = document.getElementById('passLen').value;
            const incNum = document.getElementById('incNumbers').checked;
            const incSym = document.getElementById('incSymbols').checked;
            
            let alpha = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(incNum) alpha += "0123456789";
            if(incSym) alpha += "!@#$%^&*()_+-=[]{}|";

            let pass = "";
            for(let i=0; i<len; i++) {
                pass += alpha.charAt(Math.floor(Math.random() * alpha.length));
            }
            document.getElementById('passDisplay').innerText = pass;
        }
        function copyPassword() {
            const pass = document.getElementById('passDisplay').innerText;
            if(pass && pass !== 'Click Generate') {
                navigator.clipboard.writeText(pass);
                alert('Password copied!');
            }
        }
    </script>
</body>
</html>
