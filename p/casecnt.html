<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-sky-600/20 text-sky-400 border border-sky-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-text-height"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">Text Case Converter</h1>
                <p class="text-xs text-slate-400">Transform text formats instantly</p>
            </div>
        </div>

        <textarea id="text" placeholder="Type or paste your text..." class="w-full h-32 p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs focus:outline-none focus:border-sky-500 resize-none"></textarea>

        <div class="grid grid-cols-3 gap-2">
            <button onclick="convert('upper')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 rounded-xl text-xs font-semibold">UPPER</button>
            <button onclick="convert('lower')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 rounded-xl text-xs font-semibold">lower</button>
            <button onclick="convert('title')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 rounded-xl text-xs font-semibold">Title Case</button>
        </div>

        <button onclick="copyText()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-sky-600/20"><i class="fa-regular fa-copy"></i> Copy Output Text</button>
    </div>

    <script>
        function convert(type) {
            const area = document.getElementById('text');
            if(!area.value) return;
            if(type === 'upper') area.value = area.value.toUpperCase();
            if(type === 'lower') area.value = area.value.toLowerCase();
            if(type === 'title') {
                area.value = area.value.toLowerCase().replace(/(?:^|\s)\w/g, m => m.toUpperCase());
            }
        }
        function copyText() {
            const text = document.getElementById('text').value;
            if(text) {
                navigator.clipboard.writeText(text);
                alert('Text copied to clipboard!');
            }
        }
    </script>
</body>
</html>
