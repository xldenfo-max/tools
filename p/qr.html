<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-purple-600/20 text-purple-400 border border-purple-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">QR Code Generator</h1>
                <p class="text-xs text-slate-400">Create instant, downloadable QR codes</p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-300 block mb-1">Content / URL</label>
                <input type="text" id="qrText" placeholder="https://yourwebsite.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-purple-500 transition-all">
            </div>

            <div class="flex items-center justify-center p-6 bg-slate-950 border border-slate-800 rounded-2xl min-h-[200px]" id="qrBox">
                <p class="text-xs text-slate-500">Your QR code preview will appear here</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="generateQR()" class="py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-purple-600/20">Generate</button>
                <button onclick="downloadQR()" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-sm transition-all border border-slate-700">Download</button>
            </div>
        </div>
    </div>

    <script>
        let qrcode = null;
        function generateQR() {
            const text = document.getElementById('qrText').value.trim();
            const box = document.getElementById('qrBox');
            if(!text) return alert('Please enter text or URL');
            box.innerHTML = '';
            qrcode = new QRCode(box, { text: text, width: 160, height: 160 });
        }
        function downloadQR() {
            const img = document.querySelector('#qrBox img');
            if(img) {
                const a = document.createElement('a');
                a.href = img.src;
                a.download = 'qrcode.png';
                a.click();
            } else { alert('Please generate a QR code first!'); }
        }
    </script>
</body>
</html>
