<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-600/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-lg">
                <i class="fa-solid fa-code"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">JSON Prettifier</h1>
                <p class="text-xs text-slate-400">Validate and format JSON code</p>
            </div>
        </div>

        <textarea id="jsonInput" placeholder="Paste unformatted JSON here..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-amber-400 focus:outline-none h-32"></textarea>

        <button onclick="formatJSON()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-semibold text-xs transition-all shadow-lg shadow-amber-600/20">Prettify & Validate</button>

        <div id="jsonStatus" class="text-xs text-slate-400">Ready for input</div>

        <textarea id="jsonOutput" readonly placeholder="Formatted JSON will appear here..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-emerald-400 focus:outline-none h-40"></textarea>
    </div>

    <script>
        function formatJSON() {
            const input = document.getElementById('jsonInput').value;
            const status = document.getElementById('jsonStatus');
            const output = document.getElementById('jsonOutput');

            try {
                const parsed = JSON.parse(input);
                output.value = JSON.stringify(parsed, null, 4);
                status.innerText = ' Valid JSON Structure';
                status.className = 'text-xs text-emerald-400 font-semibold';
            } catch (e) {
                output.value = '';
                status.innerText = ' Invalid JSON: ' + e.message;
                status.className = 'text-xs text-rose-400 font-semibold';
            }
        }
    </script>
</body>
</html>
