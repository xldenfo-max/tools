<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Fitness Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-violet-600/20 text-violet-400 border border-violet-500/30 flex items-center justify-center text-lg">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">BMI Health Tracker</h1>
                <p class="text-xs text-slate-400">Calculate Body Mass Index</p>
            </div>
        </div>

        <div class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Height (cm)</label>
                    <input type="number" id="height" placeholder="170" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-violet-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="65" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-violet-500">
                </div>
            </div>

            <button onclick="calcBMI()" class="w-full py-3 bg-violet-600 hover:bg-violet-500 text-white rounded-xl font-semibold text-xs transition-all shadow-lg shadow-violet-600/20">Calculate BMI</button>

            <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl text-center">
                <span class="text-xs text-slate-400 block mb-1">Your BMI Score</span>
                <span id="bmiScore" class="text-2xl font-bold text-violet-400">0.0</span>
                <span id="bmiCategory" class="text-xs text-slate-500 block mt-1">-</span>
            </div>
        </div>
    </div>

    <script>
        function calcBMI() {
            const h = parseFloat(document.getElementById('height').value) / 100;
            const w = parseFloat(document.getElementById('weight').value);

            if(isNaN(h) || isNaN(w) || h <= 0) return alert('Enter valid height and weight');

            const bmi = (w / (h * h)).toFixed(1);
            document.getElementById('bmiScore').innerText = bmi;

            let cat = '';
            if(bmi < 18.5) cat = 'Underweight';
            else if(bmi < 24.9) cat = 'Normal Weight';
            else if(bmi < 29.9) cat = 'Overweight';
            else cat = 'Obese';

            document.getElementById('bmiCategory').innerText = cat;
        }
    </script>
</body>
</html>
