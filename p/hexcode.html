<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-pink-600/20 text-pink-400 border border-pink-500/30 flex items-center justify-center text-lg">
                <i class="fa-solid fa-palette"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">Palette Generator</h1>
                <p class="text-xs text-slate-400">Generate random UI color palettes</p>
            </div>
        </div>

        <div id="palette" class="grid grid-cols-4 gap-2 h-32 rounded-2xl overflow-hidden p-2 bg-slate-950 border border-slate-800">
            <!-- Colors injected via JS -->
        </div>

        <button onclick="generatePalette()" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white rounded-xl font-semibold text-xs transition-all shadow-lg shadow-pink-600/20">Generate New Colors</button>
    </div>

    <script>
        function generatePalette() {
            const container = document.getElementById('palette');
            container.innerHTML = '';
            for(let i=0; i<4; i++) {
                const color = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                const div = document.createElement('div');
                div.className = 'h-full rounded-xl flex items-end justify-center p-2 cursor-pointer transition-transform hover:scale-95';
                div.style.backgroundColor = color;
                div.innerHTML = `<span class="text-[10px] font-mono bg-black/60 px-1.5 py-0.5 rounded text-white">${color}</span>`;
                div.onclick = () => {
                    navigator.clipboard.writeText(color);
                    alert('Copied color: ' + color);
                };
                container.appendChild(div);
            }
        }
        generatePalette();
    </script>
</body>
</html>
