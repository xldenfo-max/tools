<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">GPA Calculator</h1>
                <p class="text-xs text-slate-400">Academic Grade Point Average</p>
            </div>
        </div>

        <div id="subjects" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <select class="grade bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none">
                    <option value="4.0">A / A+ (4.0)</option>
                    <option value="3.7">A- (3.7)</option>
                    <option value="3.3">B+ (3.3)</option>
                    <option value="3.0">B (3.0)</option>
                    <option value="2.7">B- (2.7)</option>
                    <option value="2.0">C (2.0)</option>
                </select>
                <input type="number" placeholder="Credits (e.g. 3)" class="credit bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none">
            </div>
        </div>

        <button onclick="addSubject()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl border border-slate-700">+ Add Subject</button>

        <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl text-center">
            <span class="text-xs text-slate-400 block mb-1">Your Calculated GPA</span>
            <span id="gpaVal" class="text-3xl font-extrabold text-indigo-400">0.00</span>
        </div>

        <button onclick="calcGPA()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold text-sm shadow-lg shadow-indigo-600/20">Calculate GPA</button>
    </div>

    <script>
        function addSubject() {
            const div = document.createElement('div');
            div.className = "grid grid-cols-2 gap-2";
            div.innerHTML = `
                <select class="grade bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none">
                    <option value="4.0">A / A+ (4.0)</option>
                    <option value="3.7">A- (3.7)</option>
                    <option value="3.3">B+ (3.3)</option>
                    <option value="3.0">B (3.0)</option>
                    <option value="2.7">B- (2.7)</option>
                    <option value="2.0">C (2.0)</option>
                </select>
                <input type="number" placeholder="Credits (e.g. 3)" class="credit bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs focus:outline-none">
            `;
            document.getElementById('subjects').appendChild(div);
        }

        function calcGPA() {
            const grades = document.querySelectorAll('.grade');
            const credits = document.querySelectorAll('.credit');
            let totalPoints = 0, totalCredits = 0;

            for(let i=0; i<grades.length; i++) {
                const g = parseFloat(grades[i].value);
                const c = parseFloat(credits[i].value);
                if(!isNaN(c) && c > 0) {
                    totalPoints += g * c;
                    totalCredits += c;
                }
            }
            const gpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '0.00';
            document.getElementById('gpaVal').innerText = gpa;
        }
    </script>
</body>
</html>
