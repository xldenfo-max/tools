<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Ambient Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-center">
        <div class="w-16 h-16 rounded-3xl bg-teal-600/20 text-teal-400 border border-teal-500/30 flex items-center justify-center text-2xl mx-auto">
            <i class="fa-solid fa-cloud-showers-heavy"></i>
        </div>
        <div>
            <h1 class="text-xl font-bold">Study Ambient Player</h1>
            <p class="text-xs text-slate-400">White noise for deep study & focus</p>
        </div>

        <div class="p-6 bg-slate-950 border border-slate-800 rounded-2xl flex flex-col items-center gap-4">
            <button id="playBtn" onclick="toggleRain()" class="w-16 h-16 rounded-full bg-teal-600 hover:bg-teal-500 text-white flex items-center justify-center text-xl shadow-lg shadow-teal-600/30 transition-all">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
            <span id="playStatus" class="text-xs text-slate-400">Click to Play Rain Ambient</span>
        </div>
    </div>

    <script>
        let audioCtx, noiseNode;
        let isPlaying = false;

        function toggleRain() {
            if(!isPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;

                whiteNoise.connect(filter);
                filter.connect(audioCtx.destination);
                whiteNoise.start();

                document.getElementById('playIcon').className = 'fa-solid fa-pause';
                document.getElementById('playStatus').innerText = 'Playing Relaxing Rain Sounds...';
                isPlaying = true;
            } else {
                audioCtx.close();
                document.getElementById('playIcon').className = 'fa-solid fa-play';
                document.getElementById('playStatus').innerText = 'Click to Play Rain Ambient';
                isPlaying = false;
            }
        }
    </script>
</body>
</html>
