<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-amber-600/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-font"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">Text Analyzer</h1>
                <p class="text-xs text-slate-400">Live content word counter</p>
            </div>
        </div>

        <textarea id="textInput" oninput="analyze()" placeholder="Type or paste your text here..." class="w-full h-32 p-3 bg-slate-950 border border-slate-800 rounded-2xl text-xs focus:outline-none focus:border-amber-500 resize-none"></textarea>

        <div class="grid grid-cols-3 gap-3 text-center">
            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                <span id="words" class="block text-lg font-bold text-amber-400">0</span>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Words</span>
            </div>
            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                <span id="chars" class="block text-lg font-bold text-amber-400">0</span>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Chars</span>
            </div>
            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl">
                <span id="read" class="block text-lg font-bold text-amber-400">0m</span>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Read Time</span>
            </div>
        </div>
    </div>

    <script>
        function analyze() {
            const txt = document.getElementById('textInput').value.trim();
            const words = txt ? txt.split(/\s+/).filter(w => w.length > 0).length : 0;
            const chars = txt.length;
            const readMinutes = Math.ceil(words / 200);

            document.getElementById('words').innerText = words;
            document.getElementById('chars').innerText = chars;
            document.getElementById('read').innerText = `${readMinutes}m`;
        }
    </script>
</body>
</html>
