<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant CV Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 no-print">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-file-user"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">Quick CV Creator</h1>
                    <p class="text-xs text-slate-400">Generate & Print Professional Resume</p>
                </div>
            </div>
        </div>

        <div class="space-y-3 no-print">
            <input type="text" id="cvName" placeholder="Full Name" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none">
            <div class="grid grid-cols-2 gap-2">
                <input type="email" id="cvEmail" placeholder="Email Address" class="px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none">
                <input type="text" id="cvPhone" placeholder="Phone Number" class="px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none">
            </div>
            <textarea id="cvSkills" placeholder="Skills (comma separated, e.g. HTML, CSS, Marketing)" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none h-20"></textarea>
            <textarea id="cvExp" placeholder="Work Experience / Summary" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none h-20"></textarea>
            <button onclick="updateCV()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs transition-all shadow-lg shadow-blue-600/20">Generate Preview</button>
        </div>

        <div id="cvPreview" class="p-6 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">
            <div class="border-b border-slate-800 pb-3">
                <h2 id="dispName" class="text-xl font-bold text-blue-400">Your Name</h2>
                <p id="dispContact" class="text-xs text-slate-400">email@example.com | +94 77 123 4567</p>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Skills</h3>
                <p id="dispSkills" class="text-xs text-slate-400">Your skills will appear here...</p>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Experience</h3>
                <p id="dispExp" class="text-xs text-slate-400">Your experience summary will appear here...</p>
            </div>
        </div>

        <button onclick="window.print()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-semibold text-xs no-print border border-slate-700"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
    </div>

    <script>
        function updateCV() {
            document.getElementById('dispName').innerText = document.getElementById('cvName').value || 'Your Name';
            const email = document.getElementById('cvEmail').value || 'email@example.com';
            const phone = document.getElementById('cvPhone').value || '+94 77 123 4567';
            document.getElementById('dispContact').innerText = `${email} | ${phone}`;
            document.getElementById('dispSkills').innerText = document.getElementById('cvSkills').value || 'N/A';
            document.getElementById('dispExp').innerText = document.getElementById('cvExp').value || 'N/A';
        }
    </script>
</body>
</html>
