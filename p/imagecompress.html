<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageCompress Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-rose-600/20 text-rose-400 border border-rose-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-file-image"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">Image Compressor</h1>
                <p class="text-xs text-slate-400">Reduce image size locally</p>
            </div>
        </div>

        <div class="space-y-4">
            <input type="file" id="imgInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer">

            <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                    <span>Quality</span>
                    <span id="qualVal" class="text-rose-400">60%</span>
                </div>
                <input type="range" id="qualityRange" min="10" max="90" value="60" oninput="document.getElementById('qualVal').innerText=this.value+'%'" class="w-full accent-rose-500">
            </div>

            <div id="status" class="text-xs text-slate-400 min-h-[20px]">Upload an image to start</div>

            <button onclick="compress()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-rose-600/20">Compress & Download</button>
        </div>
    </div>

    <script>
        function compress() {
            const input = document.getElementById('imgInput');
            const status = document.getElementById('status');
            const quality = parseFloat(document.getElementById('qualityRange').value) / 100;

            if(!input.files[0]) return alert('Select an image file!');
            
            status.innerText = 'Compressing file...';
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob((blob) => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = 'compressed_' + file.name;
                        a.click();
                        status.innerText = 'Done! File downloaded.';
                    }, 'image/jpeg', quality);
                }
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
