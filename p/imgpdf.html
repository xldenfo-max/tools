<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Multi-Tool Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-red-600/20 text-red-400 border border-red-500/30 flex items-center justify-center text-xl">
                <i class="fa-solid fa-file-pdf"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">PDF Converter Studio</h1>
                <p class="text-xs text-slate-400">Convert Images to PDF instantly</p>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-300 block mb-1">Select Image File</label>
                <input type="file" id="imgInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer">
            </div>

            <div id="status" class="text-xs text-slate-400 min-h-[20px]">Upload an image to convert</div>

            <button onclick="convertToPDF()" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-semibold text-sm transition-all shadow-lg shadow-red-600/20">Convert & Download PDF</button>
        </div>
    </div>

    <script>
        function convertToPDF() {
            const input = document.getElementById('imgInput');
            const status = document.getElementById('status');

            if (!input.files[0]) return alert('Please select an image file first!');

            status.innerText = 'Converting to PDF...';
            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF(img.width > img.height ? 'l' : 'p', 'px', [img.width, img.height]);
                    pdf.addImage(img, 'JPEG', 0, 0, img.width, img.height);
                    pdf.save('converted_document.pdf');
                    status.innerText = 'PDF Downloaded successfully!';
                }
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
