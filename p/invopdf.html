<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6" id="invoiceArea">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-400">INVOICE</h1>
                <p class="text-xs text-slate-400">Quick Receipt Creator</p>
            </div>
            <i class="fa-solid fa-receipt text-3xl text-slate-700"></i>
        </div>

        <div class="space-y-3 no-print">
            <input type="text" id="clientName" placeholder="Client Name" class="w-full px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="itemDesc" placeholder="Item / Service Name" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none">
                <input type="number" id="itemPrice" placeholder="Price (LKR)" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs focus:outline-none">
            </div>
            <button onclick="addItem()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-semibold text-xs transition-all">+ Add Item</button>
        </div>

        <div class="space-y-2">
            <p class="text-xs text-slate-400">Client: <span id="dispClient" class="text-white font-semibold">-</span></p>
            <table class="w-full text-xs text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-400">
                        <th class="py-2">Item</th>
                        <th class="py-2 text-right">Amount</th>
                    </tr>
                </thead>
                <tbody id="itemList" class="divide-y divide-slate-800/50">
                </tbody>
            </table>
            <div class="flex justify-between items-center pt-3 border-t border-slate-800 font-bold text-sm">
                <span>Total Amount:</span>
                <span id="totalAmt" class="text-emerald-400">LKR 0.00</span>
            </div>
        </div>

        <button onclick="window.print()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-semibold text-xs no-print border border-slate-700"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
    </div>

    <script>
        let total = 0;
        function addItem() {
            const client = document.getElementById('clientName').value;
            const item = document.getElementById('itemDesc').value;
            const price = parseFloat(document.getElementById('itemPrice').value);

            if(!item || isNaN(price)) return alert('Enter valid item and price');

            document.getElementById('dispClient').innerText = client || 'Valued Customer';
            const tbody = document.getElementById('itemList');
            tbody.innerHTML += `<tr><td class="py-2">${item}</td><td class="py-2 text-right">LKR ${price.toFixed(2)}</td></tr>`;
            
            total += price;
            document.getElementById('totalAmt').innerText = `LKR ${total.toFixed(2)}`;
            
            document.getElementById('itemDesc').value = '';
            document.getElementById('itemPrice').value = '';
        }
    </script>
</body>
</html>
